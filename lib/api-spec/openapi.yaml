openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Swedish job-search sources and listings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /jobs/sources:
    get:
      operationId: listJobSources
      tags: [jobs]
      summary: List supported Swedish job sources
      responses:
        "200":
          description: Supported job sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobSource"
  /jobs/search:
    post:
      operationId: searchJobs
      tags: [jobs]
      summary: Search selected Swedish job sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSearchInput"
      responses:
        "200":
          description: Job listings and per-source status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSearchResult"
        "400":
          description: Invalid search filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    JobSource:
      type: object
      properties:
        id:
          type: string
          enum: [jobsearch, job-ad-links, custom-feed]
        name:
          type: string
        description:
          type: string
        contentNote:
          type: ["string", "null"]
      required: [id, name, description, contentNote]
    JobSearchInput:
      type: object
      properties:
        query:
          type: string
          maxLength: 200
        location:
          type: string
          maxLength: 120
        sourceIds:
          type: array
          items:
            type: string
            enum: [jobsearch, job-ad-links, custom-feed]
          default: [jobsearch, job-ad-links]
        customFeedUrls:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 30
    JobSearchResult:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobListing"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/JobSourceResult"
        refreshedAt:
          type: string
          format: date-time
        partial:
          type: boolean
      required: [jobs, sources, refreshedAt, partial]
    JobListing:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        employer:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        sourceIds:
          type: array
          items:
            type: string
        sourceNames:
          type: array
          items:
            type: string
        sourceUrl:
          type: string
          format: uri
        description:
          type: string
        requirements:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        experienceRequirement:
          type: ["string", "null"]
        publishedAt:
          type: ["string", "null"]
          format: date-time
        deadline:
          type: ["string", "null"]
          format: date-time
        employmentType:
          type: ["string", "null"]
        contentDepth:
          type: string
          enum: [full, excerpt]
      required:
        - id
        - title
        - employer
        - location
        - sourceIds
        - sourceNames
        - sourceUrl
        - description
        - requirements
        - skills
        - experienceRequirement
        - publishedAt
        - deadline
        - employmentType
        - contentDepth
    JobSourceResult:
      type: object
      properties:
        sourceId:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [success, failed, skipped]
        resultCount:
          type: integer
        message:
          type: ["string", "null"]
      required: [sourceId, name, status, resultCount, message]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

