kind = "web"
previewPath = "/"
title = "Sweden Job Search"
description = "A personal Sweden-focused job search app built around a Java server. Import and edit a CV-based profile, gather jobs from Arbetsförmedlingen’s JobSearch and JobAd Links APIs plus custom RSS/Atom feeds, compare requirements to profile evidence, and track source-backed deadlines with configurable scheduled and manual refresh."
version = "1.0.0"
id = "artifacts/job-search-sweden"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19478

[services.development]
run = "pnpm --filter @workspace/job-search-sweden run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/job-search-sweden", "run", "build" ]
serve = "static"
publicDir = "artifacts/job-search-sweden/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19478"
BASE_PATH = "/"

[[services]]
name = "job-api"
paths = [ "/api/jobs" ]
localPort = 19479

[services.development]
run = "mvn -f server/pom.xml spring-boot:run"

[services.production.build]
args = [ "mvn", "-f", "server/pom.xml", "-DskipTests", "package" ]

[services.production.run]
args = [ "java", "-jar", "server/target/sweden-job-search-server.jar" ]

[services.production.run.env]
PORT = "19479"

[services.env]
PORT = "19479"

[services.health.startup]
path = "/api/jobs/sources"
