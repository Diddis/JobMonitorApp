kind = "web"
previewPath = "/"
title = "JobMonitor"
description = "A personal job-search app focused on Swedish openings. Save searches, gather listings from Arbetsförmedlingen’s JobSearch and JobAd Links APIs plus custom RSS/Atom feeds, compare requirements with profile skills and education, and track deadlines with scheduled and manual refresh."
version = "1.0.0"
id = "artifacts/job-search-sweden"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19478

[services.development]
run = "pnpm --filter @workspace/job-search-sweden run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/job-search-sweden", "run", "build" ]
serve = "static"
publicDir = "artifacts/job-search-sweden/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19478"
BASE_PATH = "/"

[[services]]
name = "job-api"
paths = [ "/api/jobs" ]
localPort = 19479

[services.development]
run = "mvn -f server/pom.xml spring-boot:run"

[services.production.build]
args = [ "mvn", "-f", "artifacts/job-search-sweden/server/pom.xml", "-DskipTests", "package" ]

[services.production.run]
args = [ "java", "-jar", "artifacts/job-search-sweden/server/target/sweden-job-search-server.jar" ]

[services.production.run.env]
PORT = "19479"

[services.env]
PORT = "19479"

[services.production.health.startup]
path = "/api/jobs/sources"
